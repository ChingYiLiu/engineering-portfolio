<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search prototype — query understanding, recall, and explainable ranking." />
    <title>Product Search Prototype | Engineering Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1736'/%3E%3Cpath d='M28 14a14 14 0 1 0 8.7 25l10.8 10.8 4.2-4.2L40.8 34.8A14 14 0 0 0 28 14Zm0 6a8 8 0 1 1 0 16 8 8 0 0 1 0-16Z' fill='%235eead4'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --ink:#e7f0ff; --muted:#9aabc8; --line:#26395f; --panel:#101e3d; --bg:#081226; --teal:#5eead4; --blue:#7bb4ff; --orange:#ffbd67; --red:#ff8d9b; --shadow: 0 18px 45px rgba(0,0,0,.24); }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); background: radial-gradient(circle at 5% 0%, #19376c 0, transparent 28rem), radial-gradient(circle at 95% 12%, #14354e 0, transparent 25rem), var(--bg); font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", sans-serif; }
      button,input,select { font:inherit; }
      .shell { max-width:1260px; margin:auto; padding:36px 24px 56px; }
      .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:30px; }
      .brand { display:flex; align-items:center; gap:13px; font-weight:750; letter-spacing:.01em; }
      .mark { width:37px; height:37px; display:grid; place-items:center; border-radius:11px; color:#05221f; background:var(--teal); box-shadow:0 0 0 5px rgba(94,234,212,.09); font-size:20px; }
      .tag { color:var(--teal); border:1px solid rgba(94,234,212,.38); padding:4px 10px; border-radius:999px; font-size:.78rem; }
      h1 { font-size:clamp(1.8rem,4vw,3rem); max-width:760px; line-height:1.14; letter-spacing:-.045em; margin:0 0 12px; }
      .lede { max-width:750px; color:var(--muted); margin:0 0 28px; }
      .case-meta { display:flex; flex-wrap:wrap; gap:8px 24px; margin:-12px 0 28px; color:var(--muted); font-size:.88rem; }
      .case-meta strong { color:var(--ink); margin-right:6px; }
      .searchbox { background:rgba(16,30,61,.84); border:1px solid var(--line); padding:14px; border-radius:18px; box-shadow:var(--shadow); display:grid; grid-template-columns:1fr auto; gap:10px; }
      .searchbox input { min-width:0; color:var(--ink); padding:13px 15px; background:#08152f; border:1px solid #35507e; border-radius:11px; outline:none; }
      .searchbox input:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(94,234,212,.13); }
      button { border:0; border-radius:11px; cursor:pointer; padding:12px 18px; font-weight:700; color:#06201d; background:var(--teal); }
      button:hover { filter:brightness(1.08); } button:focus-visible, select:focus-visible { outline:3px solid var(--orange); outline-offset:2px; }
      .examples { display:flex; flex-wrap:wrap; gap:8px; margin:13px 0 26px; color:var(--muted); font-size:.86rem; }
      .example { color:var(--blue); background:transparent; border:1px solid #35507e; padding:5px 10px; font-weight:600; }
      .grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
      .panel { background:rgba(16,30,61,.76); border:1px solid var(--line); border-radius:17px; box-shadow:var(--shadow); overflow:hidden; }
      .bar { display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line); gap:12px; }
      .bar strong { font-size:.95rem; } .muted { color:var(--muted); font-size:.86rem; }
      .controls { display:flex; gap:8px; align-items:center; } select { color:var(--ink); background:#13264a; border:1px solid #35507e; border-radius:8px; padding:7px 9px; font-size:.84rem; }
      .results { padding:12px; display:grid; gap:9px; }
      .item { display:grid; grid-template-columns:65px minmax(0,1fr) auto; gap:13px; padding:13px; border:1px solid transparent; border-radius:13px; background:#0b1833; transition:.18s ease; }
      .item:hover { border-color:#3b5e93; transform:translateY(-1px); }
      .swatch { height:65px; border-radius:10px; display:grid; place-items:center; color:rgba(255,255,255,.88); font-size:1.4rem; font-weight:800; }
      .item h3 { margin:1px 0 3px; font-size:1rem; } .item p { margin:0; color:var(--muted); font-size:.82rem; }
      .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; } .chip { font-size:.72rem; padding:2px 7px; border-radius:999px; background:#1a315a; color:#c8d9f8; } .chip.hot { color:#07221d; background:var(--teal); }
      .score { text-align:right; min-width:92px; } .score b { font-size:1.16rem; color:var(--teal); } .score span { display:block; color:var(--muted); font-size:.71rem; }
      .empty { padding:44px 18px; text-align:center; color:var(--muted); }
      .side { display:grid; gap:18px; position:sticky; top:18px; }
      .flow { padding:14px 18px 18px; } .step { position:relative; padding:0 0 17px 26px; font-size:.88rem; } .step:last-child { padding-bottom:0; } .step:before { content:""; width:9px; height:9px; border-radius:50%; background:#426899; position:absolute; left:1px; top:6px; box-shadow:0 0 0 4px #15294d; } .step.active:before { background:var(--teal); } .step:not(:last-child):after { content:""; position:absolute; left:5px; top:16px; height:calc(100% - 8px); border-left:1px solid #426899; } .step strong { display:block; font-size:.89rem; } .step span { color:var(--muted); font-size:.78rem; }
      .explain { padding:15px 18px 18px; display:grid; gap:10px; } .signal { padding:9px 10px; border-left:3px solid var(--blue); background:#0b1833; border-radius:5px; } .signal b { display:block; font-size:.8rem; } .signal span { color:var(--muted); font-size:.77rem; }
      .footnote { color:#7f91b3; font-size:.75rem; margin:18px 2px 0; }
      @media (max-width:860px) { .grid { grid-template-columns:1fr; }.side { position:static; grid-template-columns:1fr 1fr; }.searchbox { grid-template-columns:1fr; } }
      @media (max-width:560px) { .shell { padding:25px 14px; }.top { margin-bottom:23px; }.item { grid-template-columns:52px minmax(0,1fr); }.swatch { height:52px; }.score { grid-column:2; text-align:left; display:flex; gap:7px; align-items:baseline; }.score span { display:inline; }.side { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top"><div class="brand"><span class="mark">⌕</span> search prototype</div><span class="tag">explainable ranking</span></header>
      <h1>搜尋不只是命中關鍵字，而是理解使用者想找什麼。</h1>
      <p class="lede">以虛構商品資料模擬搜尋流程：查詢會先被理解，再以文字與語意候選池召回，最後由多種示意訊號排序。</p>
      <div class="case-meta" aria-label="專案角色與技術">
        <span><strong>角色</strong>後端／搜尋工程師</span>
        <span><strong>使用技術</strong>Python、FastAPI、Elasticsearch、Redis、asyncio、向量檢索</span>
      </div>
      <section class="searchbox" aria-label="商品搜尋">
        <input id="query" value="蘋果 手機" aria-label="輸入搜尋關鍵字" placeholder="例如：iphone 17、藍色 耳機、電子券" />
        <button id="search">搜尋</button>
      </section>
      <div class="examples"><span>試試：</span><button class="example" data-query="iphon 17">iphon 17（錯字）</button><button class="example" data-query="藍色 耳機">藍色 耳機</button><button class="example" data-query="即享券">即享券（意圖篩選）</button><button class="example" data-query="手機">手機（查詢示範）</button></div>
      <div class="grid">
        <section class="panel"><div class="bar"><div><strong id="result-title">結果</strong><span class="muted" id="result-meta"></span></div><div class="controls"><label class="muted" for="sort">排序</label><select id="sort"><option value="relevant">相關性</option><option value="price_low">價格低至高</option><option value="new_arrival">最新上架</option></select></div></div><div class="results" id="results"></div></section>
        <aside class="side">
          <section class="panel"><div class="bar"><strong>本次搜尋流程</strong></div><div class="flow" id="flow"></div></section>
          <section class="panel"><div class="bar"><strong>排序訊號</strong></div><div class="explain" id="signals"></div></section>
        </aside>
      </div>
      <p class="footnote">此頁為作品集展示用的前端 prototype；商品、分數、權重與規則皆為獨立設計的虛構範例，不對應正式服務的實作。</p>
    </main>
    <script>
      const catalog = [
        {id:1, name:"Orion Pro 智慧手機 256GB", brand:"Orion", cats:["手機","3c"], color:"鈦藍", price:27900, stock:1, fresh:8, popularity:9, terms:["orion","iphone","手機","智慧手機","17"], semantic:["手機","通訊","旗艦"], swatch:"linear-gradient(135deg,#1d4165,#8bb4d5)", icon:"◈"},
        {id:2, name:"Nova Air 智慧手機 128GB", brand:"Nova", cats:["手機","3c"], color:"銀白", price:18900, stock:1, fresh:9, popularity:8, terms:["nova","手機","智慧手機"], semantic:["手機","通訊","輕薄"], swatch:"linear-gradient(135deg,#687a98,#e4e8f0)", icon:"◉"},
        {id:3, name:"Orbit 降噪藍牙耳機｜深海藍", brand:"Orbit", cats:["耳機","3c"], color:"藍", price:2290, stock:1, fresh:7, popularity:9, terms:["耳機","藍牙","降噪","藍色","深海藍"], semantic:["耳機","音樂","藍色"], swatch:"linear-gradient(135deg,#042f62,#0f85bd)", icon:"◌"},
        {id:4, name:"Pulse 開放式藍牙耳機｜霧藍", brand:"Pulse", cats:["耳機","3c"], color:"藍", price:1590, stock:1, fresh:10, popularity:6, terms:["耳機","藍牙","開放式","藍色","霧藍"], semantic:["耳機","音樂","藍色"], swatch:"linear-gradient(135deg,#305991,#9bbce1)", icon:"◌"},
        {id:5, name:"Wave 藍色耳機保護殼", brand:"Wave", cats:["配件","耳機"], color:"藍", price:390, stock:1, fresh:5, popularity:4, terms:["耳機","保護殼","藍色","配件"], semantic:["耳機","配件","藍色"], swatch:"linear-gradient(135deg,#24478b,#68a5ff)", icon:"□"},
        {id:6, name:"城市咖啡即享券 100 元", brand:"Cafe Loop", cats:["電子券","虛擬商品"], color:"", price:100, stock:1, fresh:4, popularity:8, terms:["即享券","電子券","咖啡","禮券"], semantic:["電子券","禮物","咖啡"], virtual:true, swatch:"linear-gradient(135deg,#492717,#d58b44)", icon:"¥"},
        {id:7, name:"雲端影城電子票券", brand:"Cine Cloud", cats:["電子券","虛擬商品"], color:"", price:260, stock:1, fresh:6, popularity:7, terms:["即享券","電子券","票券","電影"], semantic:["電子券","娛樂","禮物"], virtual:true, swatch:"linear-gradient(135deg,#4c2066,#b366e5)", icon:"▶"},
        {id:8, name:"Vertex 行動電源 20,000mAh", brand:"Vertex", cats:["充電","3c"], color:"黑", price:1090, stock:1, fresh:3, popularity:9, terms:["行動電源","手機","充電","3c"], semantic:["手機","配件","電力"], swatch:"linear-gradient(135deg,#171d2c,#545c6d)", icon:"▰"}
      ];
      const aliases = { iphon:"iphone", iphone:"orion", 蘋果:"orion", apple:"orion", 藍色:"藍", 藍:"藍", 即享券:"電子券" };
      const state = { raw:"", tokens:[], parsed:[], fallback:false, items:[] };
      const $ = s => document.querySelector(s);
      const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
      function tokenize(raw) { return raw.toLowerCase().trim().split(/[\s,，、]+/).filter(Boolean); }
      function understand(raw) {
        const source = tokenize(raw); const notes=[]; let words=[]; let virtual=false;
        source.forEach(token => { const fixed=aliases[token]; if(fixed){ words.push(fixed); notes.push(token === fixed ? `辨識「${token}」` : `「${token}」→「${fixed}」`); } else words.push(token); });
        if (source.some(t => ["即享券","電子券","票券"].includes(t))) { virtual=true; notes.push("偵測虛擬商品意圖"); }
        if (source.some(t => ["iphone","iphon","蘋果","apple"].includes(t))) notes.push("品牌別名映射：Orion");
        if (source.some(t => t.includes("藍"))) notes.push("顏色標籤：藍");
        return { words:[...new Set(words)], notes, virtual };
      }
      function score(item, parsed) {
        let text=0, semantic=0, color=0, stock=item.stock ? 4 : -25;
        parsed.words.forEach(w => { if (item.terms.some(t => t.includes(w) || w.includes(t))) text += 13; if (item.semantic.some(t => t.includes(w) || w.includes(t))) semantic += 7; });
        if(parsed.words.includes("藍") && item.color.includes("藍")) color=8;
        return {total:text+semantic+color+stock+item.popularity, text, semantic, color, stock};
      }
      function run() {
        state.raw=$("#query").value; const parsed=understand(state.raw); state.parsed=parsed;
        let scored=catalog.filter(x => !parsed.virtual || x.virtual).map(item=>({...item, score:score(item,parsed)}));
        const strong=scored.filter(x=>x.score.text>0);
        state.fallback=!strong.length && state.raw.trim() !== "";
        if(state.fallback) scored.forEach(x => { if(parsed.words.some(w => x.semantic.some(s => s.includes(w) || w.includes(s)))) x.score.total+=18; });
        state.items=scored; render();
      }
      function sorted() { const mode=$("#sort").value; return [...state.items].sort((a,b)=> mode==="price_low" ? a.price-b.price || b.score.total-a.score.total : mode==="new_arrival" ? b.fresh-a.fresh || b.score.total-a.score.total : b.score.total-a.score.total); }
      function render() {
        const list=sorted(); const parsed=state.parsed;
        $("#result-title").textContent=`${list.length} 個候選結果`;
        $("#result-meta").textContent=state.raw ? `／「${state.raw}」` : "／請輸入關鍵字";
        $("#results").innerHTML=list.length ? list.map(x=>`<article class="item"><div class="swatch" style="background:${x.swatch}">${x.icon}</div><div><h3>${esc(x.name)}</h3><p>${esc(x.brand)} · ${esc(x.cats.join(" / "))} · ${x.stock?"有庫存":"暫缺貨"}</p><div class="chips"><span class="chip">文字 +${x.score.text}</span>${x.score.semantic?`<span class="chip">語意 +${x.score.semantic}</span>`:""}${x.score.color?`<span class="chip">顏色 +${x.score.color}</span>`:""}</div></div><div class="score"><b>${x.score.total}</b><span>NT$${x.price.toLocaleString()}</span></div></article>`).join(""):'<div class="empty">沒有符合篩選條件的商品。試試「手機」、「藍色 耳機」或「即享券」。</div>';
        const stages=[
          ["查詢理解", parsed.notes.length?parsed.notes.join("；"):"保留原始關鍵字", true],
          ["文字召回", `${state.items.length} 筆候選商品`, true],
          ["向量 fallback", state.fallback?"沒有文字強命中，補入語意近似候選":"文字命中充足，不啟動", state.fallback],
          ["規則化排序", $("#sort").selectedOptions[0].text, true],
          ["結果整理", "整理示意候選商品", true]
        ];
        $("#flow").innerHTML=stages.map(([a,b,on])=>`<div class="step ${on?"active":""}"><strong>${a}</strong><span>${b}</span></div>`).join("");
        const signals=[
          ["文字相關性", "品名、品牌與分類 token 的命中強度"],
          ["語意相近度", "用於補足字面未命中的長尾查詢"],
          ["庫存與人氣", "避免暫缺貨或低品質候選搶占前排"],
          ["展示排序", "依示意訊號排列候選商品"],
        ];
        $("#signals").innerHTML=signals.map(([a,b])=>`<div class="signal"><b>${a}</b><span>${b}</span></div>`).join("");
      }
      $("#search").addEventListener("click",run); $("#query").addEventListener("keydown",e=>{if(e.key==="Enter")run()}); $("#sort").addEventListener("change",render);
      document.querySelectorAll("[data-query]").forEach(button=>button.addEventListener("click",()=>{$("#query").value=button.dataset.query;run();}));
      run();
    </script>
  </body>
</html>
